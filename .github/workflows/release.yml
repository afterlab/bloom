name: Release

# Builds every release file of a version tag on hosted runners and publishes the GitHub
# pre-release once the maintainer approves it (docs/development/releasing.md).
#
# It starts when a tag is created and when a maintainer starts it by hand, never for a branch or
# a pull request. A tag's creation is used and not its push: every commit message of this
# repository carries a skip instruction, and that suppresses the workflows of a push, a tag's
# push included. The first job ends the run for any tag that is not a version tag.
#
# A rehearsal is a start by hand with `rehearsal` checked. It builds the commit of the branch or
# tag it was started for, as the version the source tree declares, and runs every job up to and
# including the release candidate: the builds, the package checks, the clean-system starts, the
# real installs and the desktop captures. The last job does not run, so a rehearsal never waits
# for approval, never reads the key, and never creates or changes a release, a tag or the
# channel's files. It needs no validation record, and where the two repository variables are not
# set yet it builds with a key made for the run, whose private half is thrown away at once.
#
# What the repository must hold (Settings):
#   * the variables BLOOM_UPDATE_PUBLIC_KEYS (Base64 of each 32-byte Ed25519 public key, separated
#     by commas) and BLOOM_UPDATE_FEED_URL (the HTTPS address every build reads its update feed
#     from), as repository variables: the build jobs read them, and a job outside an environment
#     cannot read that environment's variables;
#   * the environment `release`, with its required reviewer, holding the secret
#     BLOOM_UPDATE_SIGNING_KEY (the Ed25519 private key as PKCS#8 PEM, without a passphrase). Only
#     the last job names that environment, so only it waits for the approval and only it can
#     read the key.
#
# The commit of the tag must carry the commit status `bloom/hardware-validation` with the state
# `success` before the tag is created: the record that the full validation, GPU included, passed
# on Linux, macOS and Windows hardware. Hosted runners have no GPU, so the package check's GPU
# rule is not run here and nothing here counts as that validation.

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build and release, for example v0.1.0-alpha.1 (a rehearsal needs none)
        required: false
        type: string
      rehearsal:
        description: Rehearsal. Build and check the selected branch up to the release candidate, and publish nothing
        required: false
        type: boolean
        default: false

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal
      && format('Rehearsal of {0}', github.ref_name)
      || format('Release {0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref) }}

concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal
                && format('rehearsal-{0}', github.sha)
                || (github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the versioned release's files and the fixed channel release's files are downloaded.
  BLOOM_RELEASE_DOWNLOADS: ${{ github.server_url }}/${{ github.repository }}/releases/download

jobs:
  # The tag is a version tag of this tree, the commit's hardware validation is recorded, and the
  # build settings are there. Nothing is built for a tag that fails any of these. A rehearsal
  # takes the version from the source tree, needs no validation record, and says so.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    name: Tag, validation record and settings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    env:
      BLOOM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
      BLOOM_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ vars.BLOOM_UPDATE_PUBLIC_KEYS }}
      BLOOM_UPDATE_FEED_URL: ${{ vars.BLOOM_UPDATE_FEED_URL }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
      commit: ${{ steps.version.outputs.commit }}
      ref: ${{ steps.version.outputs.ref }}
      public_keys: ${{ steps.settings.outputs.public_keys }}
      feed_url: ${{ steps.settings.outputs.feed_url }}
    steps:
      - name: Refuse a name that is not a version tag
        if: env.BLOOM_REHEARSAL != 'true'
        run: |
          case "$BLOOM_RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$BLOOM_RELEASE_TAG' is not a version tag"; exit 1 ;;
          esac

      - name: Check out the tag, or the commit a rehearsal was started for
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.BLOOM_REHEARSAL == 'true' && github.sha || format('refs/tags/{0}', env.BLOOM_RELEASE_TAG) }}

      # `ref` is what every later job checks out: the tag, or a rehearsal's commit.
      - name: Check the tag against the source tree and the changelog
        id: version
        run: |
          if [ "$BLOOM_REHEARSAL" = true ]; then
            python3 -I tools/release/release.py version --rehearsal | tee -a "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            python3 -I tools/release/release.py version --tag "$BLOOM_RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$BLOOM_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the recorded hardware validation of the commit
        if: env.BLOOM_REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/commits/$commit/statuses?per_page=100" > "$RUNNER_TEMP/statuses.json"
          python3 -I tools/release/release.py validation --statuses "$RUNNER_TEMP/statuses.json"

      # A rehearsal before the repository variables exist builds with a key made here. Its
      # private half is deleted in the same step, so nothing can be signed for these builds.
      - name: Check the build settings
        id: settings
        run: |
          if [ "$BLOOM_REHEARSAL" = true ] &&
             { [ -z "$BLOOM_UPDATE_PUBLIC_KEYS" ] || [ -z "$BLOOM_UPDATE_FEED_URL" ]; }; then
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/rehearsal-key.pem"
            BLOOM_UPDATE_PUBLIC_KEYS=$(python3 -I tools/release/sign_release public-key --key-file "$RUNNER_TEMP/rehearsal-key.pem")
            rm -f "$RUNNER_TEMP/rehearsal-key.pem"
            BLOOM_UPDATE_FEED_URL="$BLOOM_RELEASE_DOWNLOADS/alpha-channel/alpha.json"
            echo "::notice::Rehearsal without the repository variables: built with a key made for this run and the channel's own feed address"
          fi
          if [ -z "$BLOOM_UPDATE_PUBLIC_KEYS" ] || [ -z "$BLOOM_UPDATE_FEED_URL" ]; then
            echo "::error::Set the repository variables BLOOM_UPDATE_PUBLIC_KEYS and BLOOM_UPDATE_FEED_URL"
            exit 1
          fi
          python3 -I tools/release/release.py settings \
            --public-keys "$BLOOM_UPDATE_PUBLIC_KEYS" --feed-url "$BLOOM_UPDATE_FEED_URL"
          echo "public_keys=$BLOOM_UPDATE_PUBLIC_KEYS" >> "$GITHUB_OUTPUT"
          echo "feed_url=$BLOOM_UPDATE_FEED_URL" >> "$GITHUB_OUTPUT"

      - name: Say what a rehearsal is
        if: env.BLOOM_REHEARSAL == 'true'
        env:
          BLOOM_PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Rehearsal of $(git rev-parse HEAD) as version $BLOOM_PACKAGE_VERSION: every job up to the release candidate runs. The validation record is not required, and nothing is signed or published." >> "$GITHUB_STEP_SUMMARY"

  # The Linux files, built inside the official Ubuntu 22.04 image by digest, so they run on
  # glibc 2.35 and newer (tools/ci/linux-package).
  linux:
    needs: gate
    name: Linux package
    runs-on: ubuntu-24.04
    container: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    timeout-minutes: 360
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
      BLOOM_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ needs.gate.outputs.public_keys }}
      BLOOM_UPDATE_FEED_URL: ${{ needs.gate.outputs.feed_url }}
      # An AppImage names where its next version is found: the control file among the files of
      # the fixed channel release.
      BLOOM_UPDATE_APPIMAGE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|alpha-channel|Bloom-*x86_64.AppImage.zsync
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Provision the build environment
        run: sh tools/ci/linux-package/provision.sh

      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/linux-package/downloads
          key: bloom-release-linux-archives-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Cache dependency build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/linux-package/superbuild
            build/linux-package/prefix
          key: bloom-release-linux-prefix-${{ hashFiles('dependencies/dependencies.lock.json', 'dependencies/superbuild/**', 'tools/ci/linux-package/**') }}

      # The package tree is installed and checked on the way (contents, resolution, version,
      # icons and a run of the packaged programs), then made into the tar and the AppImage.
      - name: Build the package, check it and make its files
        run: sh tools/ci/linux-package/build.sh

      - name: Check that the package is this release's
        run: |
          cmake "-DPACKAGE=build/linux-package/bloom/package/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64" \
            -DONLY=release "-DFEED_URL=$BLOOM_UPDATE_FEED_URL" \
            "-DPUBLIC_KEYS=$BLOOM_UPDATE_PUBLIC_KEYS" -P cmake/package/check_package.cmake
          echo "Linux package check: contents, resolution, version, icons, run and release passed. GPU rule: not run (a hosted runner has no GPU)." >> "$GITHUB_STEP_SUMMARY"

      # The clean-system start of the install script needs a signed checksum list, and the
      # release's key is not in this job. A key made for this run signs a list of the tar, and
      # an install script that trusts that key goes with it; neither is published.
      - name: Make the install script form for the clean-system start
        run: |
          folder=build/linux-package/start-release
          package=build/linux-package/bloom/package
          mkdir -p "$folder"
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/start-key.pem"
          key=$(python3 -I tools/release/sign_release public-key --key-file "$RUNNER_TEMP/start-key.pem")
          cmake "-DVERSION=$BLOOM_PACKAGE_VERSION" \
            "-DBASE_URL=$BLOOM_RELEASE_DOWNLOADS/$BLOOM_RELEASE_TAG" "-DPUBLIC_KEYS=$key" \
            "-DOUTPUT=$folder/install.sh" -P cmake/package/make_install_script.cmake
          python3 -I tools/release/sums.py write --out "$folder/SHA256SUMS" \
            "$package/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.tar.xz"
          python3 -I tools/release/sign_release detached --key-file "$RUNNER_TEMP/start-key.pem" \
            --out "$folder/SHA256SUMS.sig" "$folder/SHA256SUMS"
          rm -f "$RUNNER_TEMP/start-key.pem"

      - name: Upload the Linux files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux
          if-no-files-found: error
          compression-level: 0
          path: |
            build/linux-package/bloom/package/Bloom-${{ needs.gate.outputs.version }}-linux-x86_64.tar.xz
            build/linux-package/bloom/package/Bloom-${{ needs.gate.outputs.version }}-linux-x86_64.AppImage
            build/linux-package/bloom/package/Bloom-${{ needs.gate.outputs.version }}-linux-x86_64.AppImage.zsync

      - name: Upload the install script form
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: start-release-linux
          if-no-files-found: error
          path: build/linux-package/start-release

  # The clean-system start (tools/ci/linux-package/start.sh) of the tar, the AppImage and the
  # install script, each on bare official images that have the declared system libraries and
  # no Python, Qt or compiler.
  linux-start:
    needs: [gate, linux]
    name: Clean start on ${{ matrix.system }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Ubuntu 22.04
            image: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
          - system: Ubuntu 24.04
            image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
          - system: Debian 12
            image: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
          - system: Fedora 44
            image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # The checkout unpacks an archive of the source; one image has no tar of its own.
      - name: Make sure the image can unpack the source
        run: |
          if ! command -v tar > /dev/null 2>&1 || ! command -v gzip > /dev/null 2>&1; then
            dnf install --assumeyes tar gzip
          fi

      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Prepare the clean system
        run: sh tools/ci/linux-package/clean-system.sh

      - name: Download the Linux files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files-linux
          path: release-files

      - name: Download the install script form
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: start-release-linux
          path: start-release

      - name: Start the tar
        run: |
          sh tools/ci/linux-package/start.sh \
            "$PWD/release-files/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.tar.xz" "$RUNNER_TEMP/start-tar"

      - name: Start the AppImage
        run: |
          chmod +x "release-files/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.AppImage"
          sh tools/ci/linux-package/start.sh \
            "$PWD/release-files/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.AppImage" "$RUNNER_TEMP/start-appimage"

      - name: Install with the install script, start and uninstall
        run: |
          cp "release-files/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.tar.xz" start-release/
          sh tools/ci/linux-package/start.sh "$PWD/start-release/install.sh" "$RUNNER_TEMP/start-install"

  # The installed Linux files on a desktop (tools/ci/captures): Bloom installed by the install
  # script on a bare Ubuntu 24.04 image, then shown in an application menu, in a launcher and
  # with its own window, on a display of this job's own.
  linux-desktop:
    needs: [gate, linux]
    name: Linux desktop captures
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    timeout-minutes: 30
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Prepare the clean system
        run: sh tools/ci/linux-package/clean-system.sh

      - name: Install the desktop the captures are taken on
        run: |
          apt-get install --yes --no-install-recommends \
            xvfb openbox tint2 rofi imagemagick x11-utils xdotool fonts-dejavu-core

      - name: Download the Linux files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files-linux
          path: release-files

      - name: Download the install script form
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: start-release-linux
          path: start-release

      - name: Install with the install script
        run: |
          cp "release-files/Bloom-$BLOOM_PACKAGE_VERSION-linux-x86_64.tar.xz" start-release/
          mkdir -p "$RUNNER_TEMP/desktop-home"
          HOME="$RUNNER_TEMP/desktop-home" sh start-release/install.sh --from "$PWD/start-release" \
            --prefix "$RUNNER_TEMP/desktop-home/.local/opt/bloom"

      - name: Take the captures
        run: |
          bash tools/ci/captures/linux.sh "$PWD/captures" \
            "$RUNNER_TEMP/desktop-home/.local/opt/bloom" "$RUNNER_TEMP/desktop-home"

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-linux
          if-no-files-found: error
          path: captures

  # The macOS files: the zip the updater downloads, the disk image and the installer package.
  # After they are uploaded, the same build directory makes the test build of an older version
  # and the end-to-end update test updates it to the zip and has it put back
  # (tools/ci/macos-package/update-test.sh). That test runs here and not on the project's own
  # Mac because the platform's updater needs a desktop's login session. Its result is the job
  # `macos-update`, so a failure fails the run without holding back the install and the captures.
  macos:
    needs: gate
    name: macOS package
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      update: ${{ steps.update.outcome }}
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ needs.gate.outputs.public_keys }}
      BLOOM_UPDATE_FEED_URL: ${{ needs.gate.outputs.feed_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Select newest Xcode
        run: |
          newest=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      # Build tools only. Every library Bloom links comes from the locked prefix.
      - name: Install build tools
        run: brew install ninja meson

      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bloom-dependency-downloads
          key: bloom-release-macos-archives-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Cache dependency build
        id: cache-dependency-prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/bloom-superbuild
            build/dependency-prefix
          key: bloom-release-macos-26-prefix-${{ runner.arch }}-${{ hashFiles('dependencies/dependencies.lock.json', 'dependencies/superbuild/**') }}

      - name: Build dependency superbuild prefix
        if: steps.cache-dependency-prefix.outputs.cache-hit != 'true'
        run: |
          cmake -S dependencies/superbuild -B "$RUNNER_TEMP/bloom-superbuild" -G Ninja \
            -DBLOOM_DEPENDENCY_DOWNLOAD_DIR="$RUNNER_TEMP/bloom-dependency-downloads" \
            -DBLOOM_DEPENDENCY_PREFIX="$GITHUB_WORKSPACE/build/dependency-prefix"
          cmake --build "$RUNNER_TEMP/bloom-superbuild"

      # The platform's updater, a prebuilt item checked by its recorded checksum
      # (dependencies/update-runtime).
      - name: Put the updater into the prefix
        run: |
          cmake -DBLOOM_RECORD="$GITHUB_WORKSPACE/dependencies/update-runtime/sparkle.json" \
            -DBLOOM_DESTINATION="$GITHUB_WORKSPACE/build/dependency-prefix/sparkle" \
            -DBLOOM_DOWNLOAD_DIR="$RUNNER_TEMP/bloom-dependency-downloads" \
            -DBLOOM_ALLOW_DOWNLOADS=ON \
            -P dependencies/superbuild/projects/update-runtime-fetch.cmake

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DBLOOM_DEPENDENCY_MODE=qualified \
            -DBLOOM_DEPENDENCY_PREFIX="$GITHUB_WORKSPACE/build/dependency-prefix" \
            -DBLOOM_BUILD_DESKTOP=ON \
            -DBLOOM_BUILD_PYTHON=ON \
            -DBLOOM_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            "-DBLOOM_PACKAGE_VERSION=$BLOOM_PACKAGE_VERSION" \
            "-DBLOOM_UPDATE_FEED_URL=$BLOOM_UPDATE_FEED_URL" \
            "-DBLOOM_UPDATE_PUBLIC_KEYS=$BLOOM_UPDATE_PUBLIC_KEYS"

      # The bundle is filled, signed ad hoc and checked for what it loads, then made into the
      # zip, the disk image and the installer package.
      - name: Build the bundle and make its files
        run: cmake --build build/release --target bloom-package-archives --parallel

      - name: Check the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake "-DPACKAGE=$GITHUB_WORKSPACE/build/release/apps/bloom/Bloom.app" -DCOMPLETE=ON \
            -DRUN=ON -DRELEASE=ON "-DVERSION=$BLOOM_PACKAGE_VERSION" \
            "-DFEED_URL=$BLOOM_UPDATE_FEED_URL" "-DPUBLIC_KEYS=$BLOOM_UPDATE_PUBLIC_KEYS" \
            "-DWORK=$RUNNER_TEMP/package-check" -P cmake/package/check_package.cmake
          echo "macOS package check: contents, resolution, version, icons, run and release passed. GPU rule: not run (a hosted runner has no GPU)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the disk image and the installer package
        run: ctest --test-dir build/release -R '^bloom\.package\.installers$' --output-on-failure --no-tests=error

      - name: Upload the macOS files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-macos
          if-no-files-found: error
          compression-level: 0
          path: |
            build/release/package/Bloom-${{ needs.gate.outputs.version }}-macos-arm64.zip
            build/release/package/Bloom-${{ needs.gate.outputs.version }}-macos-arm64.dmg
            build/release/package/Bloom-${{ needs.gate.outputs.version }}-macos-arm64.pkg

      - name: Update a test build to the zip, and have it put back
        id: update
        continue-on-error: true
        run: |
          set -o pipefail
          sh tools/ci/macos-package/update-test.sh build/release "$BLOOM_PACKAGE_VERSION" \
            "$RUNNER_TEMP/update-test" 2>&1 | tee "$RUNNER_TEMP/update-test.txt"

      - name: Upload the update test's output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-test-macos
          if-no-files-found: error
          path: ${{ runner.temp }}/update-test.txt

  # The result of the macOS end-to-end update test, which ran in the build job.
  macos-update:
    needs: [gate, macos]
    name: macOS end-to-end update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BLOOM_UPDATE_TEST: ${{ needs.macos.outputs.update }}
    steps:
      - name: Require that the update and the going back passed
        run: |
          if [ "$BLOOM_UPDATE_TEST" != success ]; then
            echo "::error::The macOS end-to-end update test ended as '$BLOOM_UPDATE_TEST'; its output is the artifact update-test-macos"
            exit 1
          fi
          echo "macOS end-to-end update test: the test build was updated to the built zip by the platform's updater, and put back when a candidate could not start." >> "$GITHUB_STEP_SUMMARY"

  # The installer package installed for real (tools/ci/macos-package/installed.sh): the hosted
  # machine is thrown away afterwards and its user needs no password for it. Bloom.app is in
  # /Applications, bloom-cli is linked in /usr/local/bin and renders a frame through that link,
  # and the disk image attaches with its window layout. Then the desktop captures of the
  # installed application (tools/ci/captures). A failure of either fails the run.
  macos-install:
    needs: [gate, macos]
    name: macOS install and desktop captures
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Download the macOS files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files-macos
          path: release-files

      - name: Install the package, render through the linked bloom-cli and attach the disk image
        run: |
          sh tools/ci/macos-package/installed.sh \
            "release-files/Bloom-$BLOOM_PACKAGE_VERSION-macos-arm64.pkg" \
            "release-files/Bloom-$BLOOM_PACKAGE_VERSION-macos-arm64.dmg" \
            "$BLOOM_PACKAGE_VERSION" "$RUNNER_TEMP/installed"
          echo "macOS: the installer package was installed with the system's installer; /Applications/Bloom.app and the /usr/local/bin/bloom-cli link were checked, a frame was rendered through the link, and the disk image was attached and read." >> "$GITHUB_STEP_SUMMARY"

      - name: Take the captures
        run: |
          bash tools/ci/captures/macos.sh "$PWD/captures" \
            "release-files/Bloom-$BLOOM_PACKAGE_VERSION-macos-arm64.dmg"

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-macos
          if-no-files-found: error
          path: captures

  # The Windows files: the installer and the zip.
  windows:
    needs: gate
    name: Windows package
    runs-on: windows-2025
    timeout-minutes: 480
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ needs.gate.outputs.public_keys }}
      BLOOM_UPDATE_FEED_URL: ${{ needs.gate.outputs.feed_url }}
      MSYS2_ROOT: C:\msys64
      MSYS2_PATH_TYPE: inherit
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      # Build tools only. Every library Bloom links comes from the locked prefix.
      - name: Install build tools
        shell: cmd
        run: |
          python -m venv "%RUNNER_TEMP%\tools-venv"
          "%RUNNER_TEMP%\tools-venv\Scripts\pip" install --quiet meson==1.12.1 ninja==1.13.2 || exit /b 1
          rem Through MSYS2's own login shell, so the package tool's hooks find MSYS2's programs.
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make patch pkgconf perl"

      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bloom-dependency-downloads
          key: bloom-release-windows-archives-${{ hashFiles('dependencies/dependencies.lock.json') }}

      - name: Cache dependency build
        id: cache-dependency-prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/bloom-superbuild
            build/dependency-prefix
          key: bloom-release-windows-2025-prefix-${{ runner.arch }}-${{ hashFiles('dependencies/dependencies.lock.json', 'dependencies/superbuild/**') }}

      # Each step that compiles starts from the Visual Studio developer environment of the newest
      # installed toolset, found with vswhere, with the build tools before the machine's own.
      #
      # The dependency build also runs configure scripts in MSYS2's shell. Those scripts must
      # get MSYS2's own programs (expr, sed, sort, find): a hosted machine has other sets of
      # such programs on its search path, and one of another kind reads its arguments
      # differently, which breaks a script in ways that look like its own fault. The compiler's
      # folder must still come first, because MSYS2 has a `link` of its own. So MSYS2 is put
      # before the machine's path, the developer environment is put before that, and the step
      # stops at once when the first `expr` is not MSYS2's or the first `link` not the compiler's.
      - name: Build dependency superbuild prefix
        if: steps.cache-dependency-prefix.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          set "PATH=%RUNNER_TEMP%\tools-venv\Scripts;C:\msys64\usr\bin;%PATH%"
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where expr > "%RUNNER_TEMP%\first-expr.txt" || exit /b 1
          where link > "%RUNNER_TEMP%\first-link.txt" || exit /b 1
          set /p BLOOM_FIRST_EXPR=<"%RUNNER_TEMP%\first-expr.txt"
          set /p BLOOM_FIRST_LINK=<"%RUNNER_TEMP%\first-link.txt"
          echo expr: %BLOOM_FIRST_EXPR%
          echo link: %BLOOM_FIRST_LINK%
          rem One line each, without brackets: a path may hold one.
          if /i not "%BLOOM_FIRST_EXPR%"=="C:\msys64\usr\bin\expr.exe" echo ::error::The first expr on the search path is not the one of MSYS2& exit /b 1
          echo %BLOOM_FIRST_LINK% | findstr /i /c:"\VC\Tools\MSVC\" > nul
          if errorlevel 1 echo ::error::The first link on the search path is not the one of the compiler& exit /b 1
          cmake -S dependencies/superbuild -B "%RUNNER_TEMP%\bloom-superbuild" -G Ninja ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release ^
            -DBLOOM_DEPENDENCY_DOWNLOAD_DIR="%RUNNER_TEMP%\bloom-dependency-downloads" ^
            -DBLOOM_DEPENDENCY_PREFIX="%GITHUB_WORKSPACE%\build\dependency-prefix" || exit /b 1
          cmake --build "%RUNNER_TEMP%\bloom-superbuild"

      # The platform's updater and the installer compiler, prebuilt items checked by their
      # recorded checksums (dependencies/update-runtime, dependencies/installer-tools).
      - name: Put the updater and the installer compiler into the prefix
        shell: cmd
        run: |
          cmake -DBLOOM_RECORD="%GITHUB_WORKSPACE%\dependencies\update-runtime\winsparkle.json" ^
            -DBLOOM_DESTINATION="%GITHUB_WORKSPACE%\build\dependency-prefix\winsparkle" ^
            -DBLOOM_DOWNLOAD_DIR="%RUNNER_TEMP%\bloom-dependency-downloads" ^
            -DBLOOM_ALLOW_DOWNLOADS=ON ^
            -P dependencies/superbuild/projects/update-runtime-fetch.cmake || exit /b 1
          cmake -DBLOOM_RECORD="%GITHUB_WORKSPACE%\dependencies\installer-tools\innosetup.json" ^
            -DBLOOM_DESTINATION="%GITHUB_WORKSPACE%\build\dependency-prefix\innosetup" ^
            -DBLOOM_DOWNLOAD_DIR="%RUNNER_TEMP%\bloom-dependency-downloads" ^
            -DBLOOM_ALLOW_DOWNLOADS=ON ^
            -P dependencies/superbuild/projects/installer-tools-fetch.cmake

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%RUNNER_TEMP%\tools-venv\Scripts;%PATH%"
          cmake -S . -B build/release -G Ninja ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DBLOOM_DEPENDENCY_MODE=qualified ^
            -DBLOOM_DEPENDENCY_PREFIX="%GITHUB_WORKSPACE%\build\dependency-prefix" ^
            -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\build\dependency-prefix" ^
            -DBLOOM_BUILD_DESKTOP=ON ^
            -DBLOOM_BUILD_PYTHON=ON ^
            -DBLOOM_WARNINGS_AS_ERRORS=ON ^
            -DBUILD_TESTING=ON ^
            -DCMAKE_BUILD_TYPE=Release ^
            "-DBLOOM_PACKAGE_VERSION=%BLOOM_PACKAGE_VERSION%" ^
            "-DBLOOM_UPDATE_FEED_URL=%BLOOM_UPDATE_FEED_URL%" ^
            "-DBLOOM_UPDATE_PUBLIC_KEYS=%BLOOM_UPDATE_PUBLIC_KEYS%"

      # The package folder is installed and checked on the way (contents, resolution, version,
      # icons and a run of the packaged programs), then made into the zip and the installer.
      - name: Build the package, check it and make its files
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=%RUNNER_TEMP%\tools-venv\Scripts;%PATH%"
          cmake --build build/release --target bloom-package-archives --parallel

      - name: Check that the package is this release's
        shell: cmd
        run: |
          cmake "-DPACKAGE=%GITHUB_WORKSPACE%\build\release\package\Bloom-%BLOOM_PACKAGE_VERSION%-windows-x86_64" ^
            -DONLY=release "-DFEED_URL=%BLOOM_UPDATE_FEED_URL%" ^
            "-DPUBLIC_KEYS=%BLOOM_UPDATE_PUBLIC_KEYS%" -P cmake/package/check_package.cmake || exit /b 1
          echo Windows package check: contents, resolution, version, icons, run and release passed. GPU rule: not run (a hosted runner has no GPU).>> "%GITHUB_STEP_SUMMARY%"

      - name: Install, upgrade and uninstall with the installer
        run: ctest --test-dir build/release -R '^bloom\.package\.installers$' --output-on-failure --no-tests=error

      - name: Upload the Windows files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            build/release/package/Bloom-${{ needs.gate.outputs.version }}-windows-x86_64.zip
            build/release/package/Bloom-${{ needs.gate.outputs.version }}-windows-x86_64-setup.exe

  # The installer run the way an artist's double click runs it, for the current user and
  # without a question, then the desktop captures of the installed application
  # (tools/ci/captures), and the uninstall.
  windows-install:
    needs: [gate, windows]
    name: Windows install and desktop captures
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Download the Windows files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files-windows
          path: release-files

      - name: Install for this user with the installer
        shell: pwsh
        run: |
          $setup = "release-files\Bloom-$env:BLOOM_PACKAGE_VERSION-windows-x86_64-setup.exe"
          $log = "$env:RUNNER_TEMP\install.log"
          $run = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          if ($run.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "the installer ended with $($run.ExitCode)"
          }
          $installed = "$env:LOCALAPPDATA\Programs\Bloom"
          if (-not (Test-Path "$installed\Bloom.exe")) { throw "Bloom.exe was not installed in $installed" }
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Bloom.lnk"
          if (-not (Test-Path $shortcut)) { throw "the Start menu entry was not made" }

      - name: Take the captures
        shell: pwsh
        run: |
          & tools\ci\captures\windows.ps1 -Out "$PWD\captures" -Installed "$env:LOCALAPPDATA\Programs\Bloom"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $uninstaller = "$env:LOCALAPPDATA\Programs\Bloom\unins000.exe"
          if (Test-Path $uninstaller) {
            $run = Start-Process -FilePath $uninstaller -Wait -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            if ($run.ExitCode -ne 0) { throw "the uninstaller ended with $($run.ExitCode)" }
          }

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-windows
          if-no-files-found: error
          path: captures

  # The three platforms' captures as one artifact, one folder per platform.
  captures:
    needs: [linux-desktop, macos-install, windows-install]
    name: Desktop captures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the platforms' captures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: captures-*
          path: desktop-captures

      - name: Upload them as one artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-captures
          if-no-files-found: error
          path: desktop-captures

  # The release candidate: the three platforms' files with the release notes, the install
  # script, the Arch Linux package description and the checksum list. Nothing is signed yet.
  # The end-to-end update test runs against these files before the maintainer approves. It is
  # the last job of a rehearsal.
  candidate:
    needs: [gate, linux, linux-start, macos, macos-update, windows, captures]
    name: Release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
      BLOOM_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      BLOOM_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ needs.gate.outputs.public_keys }}
      BLOOM_UPDATE_FEED_URL: ${{ needs.gate.outputs.feed_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Download the platforms' files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: files-*
          merge-multiple: true
          path: ${{ runner.temp }}/files

      - name: Assemble the candidate
        run: |
          python3 -I tools/release/release.py candidate --version "$BLOOM_PACKAGE_VERSION" \
            --files "$RUNNER_TEMP/files" --public-keys "$BLOOM_UPDATE_PUBLIC_KEYS" \
            --base-url "$BLOOM_RELEASE_DOWNLOADS/$BLOOM_RELEASE_TAG" --out "$RUNNER_TEMP/candidate"
          {
            echo "### Release candidate $BLOOM_PACKAGE_VERSION"
            echo
            echo '```'
            cat "$RUNNER_TEMP/candidate/SHA256SUMS"
            echo '```'
            echo
            echo "The package check's GPU rule was not run on the hosted runners. The commit's recorded hardware validation is what covers it."
            if [ "$BLOOM_REHEARSAL" = true ]; then
              echo
              echo "This is a rehearsal: the candidate is not signed and not published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          path: ${{ runner.temp }}/candidate

  # Waits for the maintainer's approval of the `release` environment. Then the candidate is
  # signed, the feed and the appcasts are written, and the pre-release and the channel's files
  # are published. A rehearsal skips the whole job, so it asks for no approval; the first step
  # refuses one all the same.
  publish:
    needs: [gate, candidate]
    if: github.event_name != 'workflow_dispatch' || !inputs.rehearsal
    name: Sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      BLOOM_PACKAGE_VERSION: ${{ needs.gate.outputs.version }}
      BLOOM_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      BLOOM_RELEASE_DATE: ${{ needs.gate.outputs.date }}
      BLOOM_RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
      BLOOM_UPDATE_PUBLIC_KEYS: ${{ needs.gate.outputs.public_keys }}
      BLOOM_UPDATE_FEED_URL: ${{ needs.gate.outputs.feed_url }}
      BLOOM_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to publish a rehearsal
        run: |
          if [ "$BLOOM_REHEARSAL" = true ]; then
            echo "::error::A rehearsal publishes nothing"
            exit 1
          fi

      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      # The key is in this step's environment only. sign_release is the one program that reads
      # it; the feed is verified with the public key before anything is published.
      - name: Sign the candidate and write the feed
        env:
          BLOOM_UPDATE_SIGNING_KEY: ${{ secrets.BLOOM_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$BLOOM_UPDATE_SIGNING_KEY" ]; then
            echo "::error::The release environment has no BLOOM_UPDATE_SIGNING_KEY secret"
            exit 1
          fi
          python3 -I tools/release/release.py publish --version "$BLOOM_PACKAGE_VERSION" \
            --date "$BLOOM_RELEASE_DATE" --candidate "$RUNNER_TEMP/candidate" \
            --public-keys "$BLOOM_UPDATE_PUBLIC_KEYS" \
            --base-url "$BLOOM_RELEASE_DOWNLOADS/$BLOOM_RELEASE_TAG" \
            --channel-url "$BLOOM_RELEASE_DOWNLOADS/alpha-channel" \
            --key-variable BLOOM_UPDATE_SIGNING_KEY --out "$RUNNER_TEMP/published"

      # The published install script against the published files: the real signature and the
      # real checksum list, checked by the script itself.
      - name: Install from the signed files with the install script
        run: |
          chmod +x "$RUNNER_TEMP/published/release/install.sh"
          HOME="$RUNNER_TEMP/install-home" sh "$RUNNER_TEMP/published/release/install.sh" \
            --from "$RUNNER_TEMP/published/release" --prefix "$RUNNER_TEMP/install-check"
          test -x "$RUNNER_TEMP/install-check/bin/Bloom"
          HOME="$RUNNER_TEMP/install-home" sh "$RUNNER_TEMP/published/release/install.sh" \
            --uninstall --prefix "$RUNNER_TEMP/install-check"

      - name: Publish the pre-release
        run: |
          release="$RUNNER_TEMP/published/release"
          if gh release view "$BLOOM_RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::A release for $BLOOM_RELEASE_TAG exists already; a published release is not replaced"
            exit 1
          fi
          kind=--prerelease
          case "$BLOOM_PACKAGE_VERSION" in *-*) ;; *) kind=--latest ;; esac
          gh release create "$BLOOM_RELEASE_TAG" --verify-tag "$kind" \
            --title "Bloom $BLOOM_PACKAGE_VERSION" --notes-file "$release/release-notes.md" \
            "$release"/Bloom-"$BLOOM_PACKAGE_VERSION"-* "$release/install.sh" \
            "$release/PKGBUILD" "$release/SHA256SUMS" "$release/SHA256SUMS.sig" \
            "$release/alpha.json" "$release/appcast-macos.xml" "$release/appcast-windows.xml"

      # The fixed release `alpha-channel` holds what every installed copy reads: the feed, the
      # appcasts, the install script and the AppImage's control file. The feed's stable address
      # redirects to its file here.
      - name: Refresh the channel's files
        run: |
          channel="$RUNNER_TEMP/published/channel"
          if ! gh release view alpha-channel > /dev/null 2>&1; then
            gh release create alpha-channel --prerelease --target "$BLOOM_RELEASE_COMMIT" \
              --title "Alpha channel" \
              --notes "The update files of the newest alpha. Bloom and the install script read them. Download Bloom from the newest release."
          fi
          # One control file at a time: the AppImage finds it by a pattern over the names.
          gh release view alpha-channel --json assets --jq '.assets[].name' |
            { grep '\.AppImage\.zsync$' || true; } |
            while read -r old; do gh release delete-asset alpha-channel "$old" --yes; done
          gh release upload alpha-channel --clobber "$channel"/*
